name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cả test frontend (src/**) lẫn test thuần của server (server/tests/**)
      # đều do vitest ở gốc chạy — server không có runner riêng.
      - run: npm test
      - run: npm run lint
