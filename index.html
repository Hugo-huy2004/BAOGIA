    <script>
      // Apply the platform theme before React paints, while keeping PWA mode
      // independent from color scheme.
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
      if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) {
        document.documentElement.classList.add("standalone-pwa");
      }
    </script>

    <!-- Fonts load async (media="print" swap trick) so they never block first paint;
         system font renders immediately, web font swaps in when ready. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700;800&display=swap"

      media="print"
      onload="this.media='all'"
    />

    <!-- Google Material Symbols Outlined (display=block on purpose: icons must

      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
      media="print"
      onload="this.media='all';document.documentElement.classList.add('msym-ready')"
    />
    <style>
      /* Hide icon ligature text until the Material Symbols CSS arrives
         (display=block then keeps glyphs invisible while the font file loads) */
      html:not(.msym-ready) .material-symbols-outlined { opacity: 0; }
    </style>

    <style>
      /* Hide browser UI on mobile */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        /* Prevent horizontal scrolling */
        overflow-x: hidden;
      }

      #root {
        height: 100%;
        width: 100%;
        overflow: auto;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        /* Disable zoom and pinch gestures */
        touch-action: manipulation;
        -webkit-touch-action: manipulation;
        /* Prevent horizontal scrolling */
        overflow-x: hidden;
      }
      
      /* Avoid selecting navigation/buttons/images while allowing readable text copy */
      body, button, a, nav, [role="button"], .material-symbols-outlined, img, .select-none {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      
      /* Allow text selection in chat, posts, inputs, and article contents */
      input, textarea, [contenteditable="true"], p, span, h1, h2, h3, h4, h5, h6, li, code, pre, blockquote, .select-text {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>

    <!-- React Main Root Container with Splash Screen -->
    <div id="root">
      <style>
        .hugo-splash {
          position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
          background-color: #0b0a0f;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          z-index: 99999;
        }
        @media (prefers-color-scheme: light) {
          /* Fallback for light mode, but overridden for PWA */
          html:not(.standalone-pwa) .hugo-splash { background-color: #ffffff; }
          html:not(.standalone-pwa) .hugo-splash .hugo-splash-text { color: #0f172a !important; }
          html:not(.standalone-pwa) .hugo-splash .hugo-splash-spinner { border-color: rgba(0,0,0,0.1) !important; border-top-color: #3b82f6 !important; }
        }
        .hugo-splash-spinner {
          width: 48px; height: 48px;
          border: 3px solid rgba(255, 255, 255, 0.1);
          border-radius: 50%;
          border-top-color: #f59e0b;
          animation: hugo-splash-spin 1s ease-in-out infinite;
        }
        @keyframes hugo-splash-spin {
          to { transform: rotate(360deg); }
        }
        .hugo-splash-text {
          margin-top: 24px; color: #f8f5fa; font-family: 'Plus Jakarta Sans', sans-serif;
          font-weight: 800; font-size: 16px; letter-spacing: 0.15em; text-transform: uppercase;
          opacity: 0.8; animation: hugo-splash-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes hugo-splash-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .4; }
        }
      </style>
      <div class="hugo-splash">
        <div class="hugo-splash-spinner"></div>
        <div class="hugo-splash-text">Hugo Studio</div>
      </div>
    </div>

    <!-- Main Module script entry point -->

    <!--
      Đã bỏ đoạn tự gọi requestFullscreen() ở cú chạm đầu tiên trên iOS.

      Lúc viết, Safari iOS chưa hỗ trợ Fullscreen API cho phần tử nên nó là
      no-op và không ai thấy gì. iOS 26 hỗ trợ rồi: cú chạm đầu tiên đưa trang
      vào fullscreen thật, và WebKit kèm theo một banner hệ thống
      ("… is in full screen. Swipe down to exit") cùng nút X xám đè lên giao
      diện, không tắt được bằng CSS.

      Bản native vốn đã chiếm trọn màn hình nên chẳng được thêm gì; còn trên
      web thì cướp cú chạm đầu tiên của người dùng để làm một việc họ không
      yêu cầu. Cả hai phía đều lỗ, nên xoá hẳn thay vì thêm điều kiện.
    -->
