# ============================================================================
# nginx — cổng API Hugo Studio
#
# TỆP NÀY DO MÁY SINH. Đừng sửa tay: chạy `npm run gen:nginx -- --write`.
# Nguồn: server/services.manifest.js
#
# 48 service · 46 prefix · 2 kênh WS
# ============================================================================

upstream core {
    server 127.0.0.1:8099;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.hugowishpax.studio;

    # ssl_certificate / ssl_certificate_key do certbot quản lý.

    client_max_body_size 25m;

    # /health đứng riêng: uptime check gọi nó, đi qua cả chuỗi proxy thì một
    # upstream chậm sẽ báo động nhầm là cả API chết.
    location = /health {
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
        access_log off;
    }

    # realtime — ví + thông báo, xác thực bằng member JWT trong query ?token=
    location = /ws {
        proxy_pass http://core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # chess — ván cờ realtime
    location = /ws/chess {
        proxy_pass http://core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # customer-projects
    location ^~ /api/customer-projects {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # member-progress
    location ^~ /api/member/progress {
