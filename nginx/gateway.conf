# ============================================================================
# nginx — cổng API Hugo Studio
#
# TỆP NÀY DO MÁY SINH. Đừng sửa tay: chạy `npm run gen:nginx -- --write`.
# Nguồn: apps/server/services.manifest.js
#
# 26 service · 26 prefix · 1 kênh WS
# ============================================================================

upstream core {
    least_conn;
    server 127.0.0.1:8099 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.hugowishpax.studio;

    # ssl_certificate / ssl_certificate_key do certbot quản lý.

    client_max_body_size 25m;

    # /health đứng riêng: uptime check gọi nó, đi qua cả chuỗi proxy thì một
    # upstream chậm sẽ báo động nhầm là cả API chết.
    location = /health {
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
        access_log off;
    }

    # realtime — ví + thông báo, xác thực bằng member JWT trong query ?token=
    location = /ws {
        proxy_pass http://core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # joy-gift-cards
    location ^~ /api/joy-gift-cards {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # notifications
    location ^~ /api/notifications {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # admin-brain
    location ^~ /api/admin/brain {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # security
    location ^~ /api/security {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # bookings
    location ^~ /api/bookings {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # partners
    location ^~ /api/partners {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # packages
    location ^~ /api/packages {
        proxy_cache_bypass $http_authorization;
        proxy_no_cache    $http_authorization;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # presence
    location ^~ /api/presence {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # telegram
    location ^~ /api/telegram {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # contact
    location ^~ /api/contact {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # support
    location ^~ /api/support {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # persona
    location ^~ /api/persona {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # checkin
    location ^~ /api/checkin {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # qr-key
    location ^~ /api/qr-key {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # oauth
    location ^~ /api/oauth {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # email
    location ^~ /api/email {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # admin
    location ^~ /api/admin {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # today
    location ^~ /api/today {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # payos
    location ^~ /api/payos {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # inbox
    location ^~ /api/inbox {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # radio
    location ^~ /api/radio {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # data
    location ^~ /api/data {
        proxy_cache_bypass $http_authorization;
        proxy_no_cache    $http_authorization;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # bios
    location ^~ /api/bios {
        proxy_cache_bypass $http_authorization;
        proxy_no_cache    $http_authorization;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ops
    location ^~ /api/ops {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # ota
    location ^~ /api/ota {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # joy
    location ^~ /api/joy {
        proxy_cache off;
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Bắt phần còn lại của /api. Có nhánh này thì route mới quên khai vẫn chạy
    # (rơi về core) thay vì 404 — nhưng check-gateway.mjs bắt lỗi đó ở CI, đây
    # chỉ là lưới an toàn lúc chạy.
    location /api/ {
        proxy_pass http://core;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        return 404;
    }
}
