<!doctype html>
<!--
  Cảnh video "Cài Education Hugo" (720×1280, dọc). Không tự chạy: render.mjs gọi
  window.build(lang, durations) rồi window.seek(t) từng khung — mọi chuyển động nằm
  trong MỘT GSAP timeline nên khung nào cũng tái tạo được (không dùng CSS animation).
  Nhân vật: SVG clay của Education Hugo (apps/web/public/edu).
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,500,1,0&display=block" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 720px; height: 1280px; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; color: #2b2b2b; -webkit-font-smoothing: antialiased; }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; font-feature-settings: "liga"; }
#stage { position: relative; width: 720px; height: 1280px; background: #e3f6fd; overflow: hidden; }
.layer { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
.actor { position: absolute; transform-origin: 50% 100%; }
.actor img { display: block; width: 100%; }
.actor .hat { position: absolute; left: 22%; top: 6%; width: 56%; transform: rotate(-8deg); }
.ground { position: absolute; left: -40px; right: -40px; bottom: -120px; height: 260px; border-radius: 50%; background: rgb(255 255 255 / .55); }

/* Phụ đề = bong bóng lời thoại của người dẫn */
#sub { position: absolute; z-index: 50; left: 40px; right: 40px; top: 48px; min-height: 150px; display: grid; place-items: center;
  padding: 24px 30px; border-radius: 34px; background: #fff; box-shadow: 0 8px 0 rgb(0 0 0 / .08); text-align: center; }
#sub::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -22px; translate: -50% 0; border: 18px solid transparent; border-top: 22px solid #fff; border-bottom: 0; }
#sub p { position: absolute; left: 30px; right: 30px; font-size: 38px; font-weight: 750; line-height: 1.25; letter-spacing: -.01em; opacity: 0; }
#chip { position: absolute; z-index: 40; left: 50%; top: 222px; translate: -50% 0; padding: 10px 22px; border-radius: 99px; background: #1f2b3a; color: #fff; font-size: 26px; font-weight: 700; opacity: 0; white-space: nowrap; }

/* Điện thoại: khung ngoài 400×800 tại (160,250); toạ độ bên trong tính từ (172,262) */
.phone { position: absolute; left: 160px; top: 250px; width: 400px; height: 800px; border: 12px solid #1f2b3a; border-radius: 56px; background: #fff; overflow: hidden; box-shadow: 14px 16px 0 rgb(0 0 0 / .14); }
.phone .notch { position: absolute; left: 50%; top: 10px; translate: -50% 0; width: 110px; height: 28px; border-radius: 99px; background: #1f2b3a; z-index: 30; }

.page .mini-hero { position: absolute; left: 0; right: 0; top: 120px; display: grid; justify-items: center; gap: 14px; }
.page .mini-hero img { width: 150px; }
.page .bar { height: 18px; border-radius: 9px; background: #e5e5e5; }

/* Màn hình chính */

.finger { position: absolute; z-index: 60; font-size: 96px; color: #1f2b3a; opacity: 0; text-shadow: 0 0 0 #fff, 3px 3px 0 #fff, -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff; transform-origin: 40% 10%; }

.card { display: flex; align-items: center; gap: 22px; padding: 26px 26px; border-radius: 28px; background: #fff; border: 3px solid #e5e5e5; border-bottom-width: 9px; font-size: 32px; font-weight: 700; line-height: 1.2; }

</style></head>

<script src="gsap.min.js"></script>
<script>
// ── Vật lý: cùng một trọng lực như trang giới thiệu (power1 = đường parabol) ──
const G = 2600, air = (h) => Math.sqrt(2 * h / G);
function impact(tl, el, h, at) {
  const k = Math.min(.3, Math.max(.05, Math.sqrt(2 * G * h) / 6000));
  return tl.to(el, { scaleY: 1 - k, scaleX: 1 + k * .8, duration: .07, ease: "power2.out" }, at)
    .to(el, { scaleY: 1, scaleX: 1, duration: .45, ease: "elastic.out(1,.35)" });
}
function drop(tl, el, h, at, e = .38) {
  tl.fromTo(el, { y: -h, autoAlpha: 1 }, { y: 0, duration: air(h), ease: "power1.in", immediateRender: false }, at);
  let t = at + air(h); impact(tl, el, h, t);
  for (let b = h * e * e; b > 10; b *= e * e) {
    tl.to(el, { y: -b, duration: air(b), ease: "power1.out" }, t + .05).to(el, { y: 0, duration: air(b), ease: "power1.in" });
    t += .05 + 2 * air(b); impact(tl, el, b, t);
  }
}
function jump(tl, el, h, at) {
  const t = air(h);
  tl.to(el, { scaleY: .8, scaleX: 1.14, duration: .14, ease: "power2.out" }, at)
    .to(el, { y: -h, duration: t, ease: "power1.out" }, at + .14)
    .to(el, { scaleY: 1.1, scaleX: .93, duration: .08 }, at + .14)
    .to(el, { scaleY: 1, scaleX: 1, duration: t * .8 }, at + .22)
    .to(el, { y: 0, duration: t, ease: "power1.in" }, at + .14 + t);
  impact(tl, el, h, at + .14 + 2 * t);
}
// Ngón tay bay tới (x, y) theo đường cong, chạm (lún + vòng đỏ) rồi nhả.
function tap(tl, x, y, at) {
  tl.to("#finger", { autoAlpha: 1, left: x - 38, top: y - 8, duration: .7, ease: "power2.inOut" }, at - .75)
    .to("#finger", { scale: .82, duration: .1 }, at)
    .to("#finger", { scale: 1, duration: .2 }, at + .12)
    .fromTo("#ring", { left: x, top: y, scale: .4, opacity: .9 }, { scale: 1.5, opacity: 0, duration: .5, immediateRender: false }, at);
}

let master, idle;
window.build = (lang, durations) => {
  const C = window.VIDEO_COPY[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-ui]").forEach((el) => { el.textContent = C.ui[el.dataset.ui]; });
  const sub = document.getElementById("sub");
  const chip = document.getElementById("chip");
  const BG = { intro: "#e3f6fd", why: "#fff3c4", ios: "#e3f6fd", android: "#e8f8df", done: "#ffe8f3" };
  const TAIL = { intro: "50%", why: "50%", ios: "18%", android: "82%", done: "50%" };
  master = gsap.timeline({ paused: true });

  // Mỗi cảnh dựng ở thời lượng gốc rồi giãn đều cho khớp lồng tiếng (timeScale).
  const SCENES = {
    intro(tl) {
      drop(tl, "#intro-hugo", 900, .2);
      gsap.utils.toArray(".intro-friend").forEach((el, i) => drop(tl, el, 600, .9 + i * .18, .3));
      tl.set("#intro-hugo img", { attr: { src: "buddy-correct.svg" } }, 2.3).set("#intro-hugo img", { attr: { src: "buddy-learn.svg" } }, 2.45);
      tl.to("#intro-hugo", { rotate: -7, duration: .25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 2.6); // vẫy chào
      jump(tl, "#intro-hugo", 140, 4.6);
      return 6;
    },
    why(tl) {
      tl.from(".why-card", { x: -720, duration: .55, stagger: 1.9, ease: "back.out(1.2)" }, .2);
      drop(tl, "#why-hugo", 700, .1);
      [2.3, 4.2].forEach((at) => jump(tl, "#why-hugo", 90, at));
      return 7.5;
    },
    ios(tl) {
      tl.to(chip, { opacity: 1, duration: .3 }, 0).set(chip, { textContent: C.ui.iosChip }, 0);
      tl.from("#ios-phone", { y: 1100, duration: .7, ease: "back.out(1.1)" }, .1);
      drop(tl, "#ios-guide", 700, .6);
      tap(tl, 360, 995, 4.6);                                                  // nút Chia sẻ
      tl.to("#ios-scrim", { opacity: 1, duration: .3 }, 4.8).to("#ios-sheet", { yPercent: -100, duration: .45, ease: "power3.out" }, 4.8);
      tl.to("#ios-add-row", { backgroundColor: "#d6f2ff", duration: .3 }, 7.4);
      tap(tl, 360, 837, 8);                                                    // Thêm vào MH chính
      tl.to("#ios-dialog", { yPercent: -105, duration: .45, ease: "power3.out" }, 8.3);
      tap(tl, 520, 334, 11);                                                   // Thêm
      tl.to("#ios-dialog", { yPercent: 0, duration: .4, ease: "power2.in" }, 11.3)
        .to(["#ios-sheet"], { yPercent: 0, duration: .3 }, 11.3).to("#ios-scrim", { opacity: 0, duration: .3 }, 11.3)
        .to("#finger", { autoAlpha: 0, duration: .2 }, 11.4)
        .to("#toast", { scale: 1, duration: .45, ease: "back.out(2)" }, 11.6);
      jump(tl, "#ios-guide", 120, 11.7);
      return 13;
    },
    android(tl) {
      tl.set(chip, { textContent: C.ui.androidChip }, 0).to(chip, { opacity: 1, duration: .3 }, 0);
      tl.from("#and-phone", { y: 1100, duration: .7, ease: "back.out(1.1)" }, .1);
      drop(tl, "#and-guide", 700, .6);
      tap(tl, 517, 327, 3.9);                                                  // ⋮
      tl.to("#and-menu", { scale: 1, duration: .3, ease: "back.out(1.4)" }, 4.05);
      tl.to("#and-install-row", { backgroundColor: "#e3f2ff", duration: .3 }, 6.1);
      tap(tl, 430, 502, 6.6);                                                  // Cài đặt ứng dụng
      tl.to("#and-menu", { scale: 0, duration: .2 }, 6.8).to("#and-scrim", { opacity: 1, duration: .3 }, 6.8)
        .to("#and-dialog", { scale: 1, duration: .4, ease: "back.out(1.5)" }, 6.9);
      tap(tl, 472, 732, 9);                                                    // Cài đặt
      tl.to("#and-dialog", { scale: 0, duration: .25 }, 9.25).to("#and-scrim", { opacity: 0, duration: .3 }, 9.25)
        .to("#finger", { autoAlpha: 0, duration: .2 }, 9.3)
        .to("#toast", { scale: 1, duration: .45, ease: "back.out(2)" }, 9.5);
      jump(tl, "#and-guide", 120, 9.6);
      return 11;
    },
    done(tl) {
      tl.from("#L-done .phone", { y: 1100, duration: .6, ease: "back.out(1.1)" }, 0);
      tl.from("#done-icon", { scale: 0, duration: .55, ease: "back.out(2.4)" }, .9);
      tap(tl, 360 - 0, 262 + 90 + 100 + 35 + 0, 2.2);                          // chạm biểu tượng mới
      tl.to("#finger", { autoAlpha: 0, duration: .2 }, 2.6);
      gsap.utils.toArray(".done-crew").forEach((el, i) => { drop(tl, el, 600, .3 + i * .2, .3); jump(tl, el, 150, 3 + i * .25); jump(tl, el, 100, 4.4 + i * .25); });
      return 6.5;
    },
  };

  let at = 0;
  window.sceneStarts = [];
  C.scenes.forEach((scene, i) => {
    window.sceneStarts.push(at);
    const layer = `#L-${scene.id}`;
    const tl = gsap.timeline();
    const base = SCENES[scene.id](tl);
    const length = Math.max(base, durations?.[i] || 0);
    tl.timeScale(base / length);
    master.set(layer, { autoAlpha: 1 }, at).to("#stage", { backgroundColor: BG[scene.id], duration: .5 }, at);
    master.set(sub, { "--tail": TAIL[scene.id] }, at);
    master.add(tl, at);
    // Phụ đề: chia đều thời lượng cảnh cho từng dòng.
    scene.lines.forEach((line, k) => {
      const p = document.createElement("p");
      p.textContent = line;
      sub.append(p);
      const from = at + (k / scene.lines.length) * length, to = at + ((k + 1) / scene.lines.length) * length;
      master.fromTo(p, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .25, immediateRender: false }, from + (k ? 0 : .15))
        .to(p, { opacity: 0, duration: .2 }, to - .2);
    });
    at += length;
    master.set(layer, { autoAlpha: 0 }, at).set(["#chip", "#toast", "#finger"], { opacity: 0, scale: 1 }, at).set("#toast", { scale: 0 }, at);
  });
  master.set({}, {}, at);
  // Nhân vật thở (phồng xẹp quanh chân) — timeline riêng lặp vô hạn, seek theo cùng đồng hồ.
  idle = gsap.timeline({ paused: true, repeat: -1 }).to(".actor img", { scaleY: .965, scaleX: 1.03, transformOrigin: "50% 100%", duration: 1.2, yoyo: true, repeat: 1, ease: "sine.inOut", stagger: .17 });
  return master.duration();
};
window.seek = (t) => { master.seek(t, false); idle.totalTime(t); };
window.ready = () => Promise.all([document.fonts.ready, ...[...document.images].map((img) => img.decode().catch(() => {}))]);
</script>
