################################################################################
# render.yaml — Render Blueprint
# Render CHỈ còn chạy Node.js (Express + WebSocket + cron).
#
# Python FastAPI đã tách sang Vercel (xem apps/ai/vercel.json):
# Render tính tiền theo GIỜ CHẠY, Vercel tính theo REQUEST — nên thứ gì không
# cần process sống lâu thì không nên nằm ở đây. Node.js proxy /api/ai/* sang
# đó qua AI_SERVER_URL (server-to-server, xác thực bằng X-Internal-Key).
#
# Giữ ấm instance do Cloudflare Worker lo (apps/workers/keepalive/), không phải
# self-ping trong process — xem chú thích ở cuối apps/server/server.js.
################################################################################

services:
  - type: web
    name: hugostudio-api           # Đổi thành tên service đang chạy trên Render nếu muốn update
    runtime: node
    region: singapore

    buildCommand: npm ci --workspace apps/server
    startCommand: bash start.sh

    plan: free

    healthCheckPath: /health       # Node.js cần có GET /health endpoint

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JOY_QR_SECRET
        generateValue: true

      # Dùng chung với Vercel AI server — hai bên PHẢI trùng giá trị, nếu không
      # mọi lời gọi /api/ai/* sẽ trả 401.
      - key: INTERNAL_API_KEY
        sync: false

      # URL Vercel của apps/ai, ví dụ https://hugostudio-ai.vercel.app
      - key: AI_SERVER_URL
        sync: false

      # HugoPSY — bộ não đám mây của nhân vật đồng hành (Cloudflare Workers AI,
      # gói miễn phí). Token RIÊNG chỉ quyền "Workers AI – Read" + "Edit".
      # Thiếu thì thành viên vẫn chat được bằng bộ câu soạn sẵn.
      - key: CF_AI_ACCOUNT_ID
        sync: false
      - key: CF_AI_TOKEN
        sync: false
      # Nguồn dự phòng khi Cloudflare hết lượt ngày: Groq gói Free, KHÔNG gắn thẻ.
      - key: GROQ_API_KEY
        sync: false

      # Web Push. Thiếu thì server tự tạo khoá mới MỖI lần khởi động → mọi đăng ký
      # push chết sau mỗi lần restart. Tạo một lần: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

      # Khoá origin: phải KHỚP header x-origin-auth mà Transform Rule Cloudflare gắn
      # trên api.hugowishpax.studio. Đặt luật Cloudflare TRƯỚC, rồi mới đặt biến này.
      - key: ORIGIN_SHARED_SECRET
        sync: false

      # OAuth client web — server từ chối khởi động ở production nếu thiếu.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # OAuth client iOS. Token từ app App Store mang `aud` này chứ không phải
      # client web, thiếu nó thì đăng nhập trong app trả 401 còn web vẫn chạy.
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
