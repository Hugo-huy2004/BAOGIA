################################################################################
# render.yaml — Render Blueprint
# Render CHỈ còn chạy Node.js (Express + WebSocket + cron).
#
# Python FastAPI đã tách sang Vercel (xem python-ai-server/vercel.json):
# Render tính tiền theo GIỜ CHẠY, Vercel tính theo REQUEST — nên thứ gì không
# cần process sống lâu thì không nên nằm ở đây. Node.js proxy /api/ai/* sang
# đó qua AI_SERVER_URL (server-to-server, xác thực bằng X-Internal-Key).
#
# Giữ ấm instance do Cloudflare Worker lo (workers/keepalive/), không phải
# self-ping trong process — xem chú thích ở cuối server/server.js.
################################################################################

services:
  - type: web
    name: hugostudio-api           # Đổi thành tên service đang chạy trên Render nếu muốn update
    runtime: node
    region: singapore

    buildCommand: if [ -d server ]; then cd server && npm install; else npm install; fi
    startCommand: if [ -f server/server.js ]; then node server/server.js; else node server.js; fi

    plan: free

    healthCheckPath: /health       # Node.js cần có GET /health endpoint

    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JOY_QR_SECRET
        generateValue: true

      # Dùng chung với Vercel AI server — hai bên PHẢI trùng giá trị, nếu không
      # mọi lời gọi /api/ai/* sẽ trả 401.
      - key: INTERNAL_API_KEY
        sync: false

      # URL Vercel của python-ai-server, ví dụ https://hugostudio-ai.vercel.app
      - key: AI_SERVER_URL
        sync: false
