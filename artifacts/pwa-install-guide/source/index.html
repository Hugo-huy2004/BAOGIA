<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Hugo Studio — Cài ứng dụng lên điện thoại</title>
  <!--
    Video hướng dẫn cài PWA, dựng như một trang web theo dòng thời gian.
    render.mjs gọi window.seek(giây) cho từng khung hình rồi chụp lại — không
    có animation tự chạy, nên mỗi khung hình luôn giống nhau ở mọi lần render.
    ?lang=vi|en|zh  ·  ?durations=5.1,8.2,…  (độ dài từng cảnh, theo file lời đọc)
    Mở thẳng trong trình duyệt thì tự phát để xem thử.

    Ngôn ngữ thiết kế: trang hỗ trợ của Apple — nền trắng, chữ hệ thống, một ý
    mỗi cảnh, điện thoại thật ở giữa, chạm nhẹ bằng vòng tròn xám.
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", Inter, "PingFang SC", "WenQuanYi Zen Hei", sans-serif;
      color: #1d1d1f; -webkit-font-smoothing: antialiased;
    }
    .layer { position: absolute; inset: 0; will-change: opacity, transform; }

    /* ── Chữ trên cảnh ─────────────────────────────────────────────── */
    .copy { position: absolute; left: 90px; right: 90px; top: 150px; text-align: center; }
    .eyebrow { font-size: 30px; font-weight: 600; color: #86868b; letter-spacing: .01em; }
    .title { margin-top: 18px; font-size: 72px; line-height: 1.08; font-weight: 700; letter-spacing: -.035em; text-wrap: balance; }

    /* ── Điện thoại ────────────────────────────────────────────────── */
    .device { position: absolute; left: 50%; top: 520px; width: 640px; height: 1310px; margin-left: -320px; }
    .frame {
      position: absolute; inset: 0; border-radius: 104px; border: 18px solid #1d1d1f;
      box-shadow: 0 0 0 3px #d2d2d7, 0 60px 120px -40px rgba(0,0,0,.35);
    }
    .frame.android { border-radius: 72px; }
    .screen { position: relative; width: 100%; height: 100%; border-radius: 86px; overflow: hidden; background: #fff; }
    .android .screen { border-radius: 54px; }
    .island { position: absolute; z-index: 20; top: 26px; left: 50%; width: 170px; height: 50px; margin-left: -85px; border-radius: 30px; background: #000; }
    .punch { position: absolute; z-index: 20; top: 30px; left: 50%; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #000; }
    .status { position: absolute; z-index: 15; top: 0; left: 0; right: 0; height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 22px 54px 0 66px; font-size: 26px; font-weight: 600; }
    .android .status { height: 84px; padding: 10px 40px 0 44px; font-size: 22px; }
    .status svg { height: 22px; }
    .ui { position: absolute; inset: 0; }

    /* Trang Hugo Studio đang mở trong trình duyệt — tối giản, như ảnh chụp thật. */
    .page { position: absolute; left: 0; right: 0; top: 100px; bottom: 0; padding: 70px 44px 0; text-align: center; background: #fff; }
    .page img { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.3); }
    .page h2 { margin-top: 30px; font-size: 44px; font-weight: 700; letter-spacing: -.03em; }
    .page p { margin-top: 12px; font-size: 24px; line-height: 1.4; color: #6e6e73; }
    .page .bar { height: 18px; margin: 18px auto 0; border-radius: 9px; background: #f2f2f7; }
    .page .cta { display: inline-block; margin-top: 36px; padding: 18px 36px; border-radius: 999px; background: #1d1d1f; color: #fff; font-size: 24px; font-weight: 600; }

    /* Thanh dưới của Safari (iOS 17/18). */
    .safari { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: rgba(246,246,246,.96); border-top: 1px solid #e5e5ea; }
    .safari .addr { margin: 16px 26px 0; height: 66px; border-radius: 18px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 25px; color: #1d1d1f; }
    .safari .addr small { color: #86868b; font-size: 22px; }
    .safari .tools { display: flex; justify-content: space-around; align-items: center; height: 92px; padding: 0 20px; }
    .safari .tools svg { width: 40px; height: 40px; stroke: #007aff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

    /* Thanh trên của trình duyệt trong app (Zalo / Facebook). */
    .inapp { position: absolute; left: 0; right: 0; top: 100px; height: 88px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; border-bottom: 1px solid #e5e5ea; background: #fff; font-size: 24px; font-weight: 600; }
    .inapp .dom { font-weight: 500; color: #6e6e73; }
    .inapp .x, .inapp .more { width: 52px; text-align: center; font-size: 34px; color: #1d1d1f; }

    /* Bảng tác vụ / bảng chia sẻ trượt từ dưới lên. */
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 40px 40px 0 0; background: #f2f2f7; box-shadow: 0 -10px 50px rgba(0,0,0,.18); padding: 18px 26px 60px; }
    .grabber { width: 72px; height: 9px; margin: 0 auto 22px; border-radius: 5px; background: #c7c7cc; }
    .sheet-head { display: flex; align-items: center; gap: 20px; padding: 6px 8px 26px; }
    .sheet-head img { width: 80px; height: 80px; border-radius: 18px; }
    .sheet-head b { display: block; font-size: 27px; }
    .sheet-head span { font-size: 22px; color: #86868b; }
    .group { border-radius: 22px; background: #fff; overflow: hidden; margin-bottom: 22px; }
    .row { position: relative; display: flex; align-items: center; justify-content: space-between; height: 92px; padding: 0 30px; font-size: 27px; border-top: 1px solid #e5e5ea; }
    .row:first-child { border-top: 0; }
    .row svg { width: 36px; height: 36px; stroke: #1d1d1f; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .row.hl { background: #e9e9ee; }

    /* Màn "Thêm vào Màn hình chính". */
    .nav { position: absolute; left: 0; right: 0; top: 100px; height: 96px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; font-size: 27px; }
    .nav .l, .nav .r { color: #007aff; }
    .nav .r { font-weight: 600; }
    .nav b { font-weight: 600; }
    .form { position: absolute; left: 26px; right: 26px; top: 230px; }
    .card { border-radius: 22px; background: #fff; padding: 26px; display: flex; gap: 24px; align-items: center; }
    .card img { width: 110px; height: 110px; border-radius: 25px; }
    .card .name { font-size: 29px; padding-bottom: 14px; border-bottom: 1px solid #e5e5ea; }
    .card .url { margin-top: 14px; font-size: 22px; color: #86868b; }
    .switchrow { margin-top: 26px; border-radius: 22px; background: #fff; height: 96px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; font-size: 26px; }
    .switch { position: relative; width: 92px; height: 56px; border-radius: 28px; background: #e9e9eb; }
    .switch i { position: absolute; top: 4px; left: 4px; width: 48px; height: 48px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
    .hint { margin: 16px 10px 0; font-size: 21px; line-height: 1.4; color: #86868b; }

    /* Android · Chrome. */
    .chrome { position: absolute; left: 0; right: 0; top: 84px; height: 104px; display: flex; align-items: center; gap: 18px; padding: 0 22px 0 28px; background: #fff; }
    .chrome .omni { flex: 1; height: 68px; border-radius: 34px; background: #f1f3f4; display: flex; align-items: center; padding: 0 26px; font-size: 25px; color: #202124; }
    .chrome .kebab { width: 50px; text-align: center; font-size: 40px; line-height: 1; color: #5f6368; }
    .menu { position: absolute; top: 104px; right: 16px; width: 400px; border-radius: 20px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.22); padding: 12px 0; transform-origin: top right; }
    .menu .item { position: relative; height: 82px; display: flex; align-items: center; gap: 22px; padding: 0 28px; font-size: 25px; color: #202124; }
    .menu .item svg { width: 34px; height: 34px; stroke: #5f6368; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .menu .item.hl { background: #e8f0fe; }
    .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.32); }
    .dialog { position: absolute; left: 50px; right: 50px; top: 430px; border-radius: 34px; background: #fff; padding: 40px 38px 30px; }
    .dialog h3 { font-size: 32px; font-weight: 500; }
    .dialog .app { display: flex; gap: 22px; align-items: center; margin-top: 30px; }
    .dialog .app img { width: 84px; height: 84px; border-radius: 20px; }
    .dialog .app b { display: block; font-size: 27px; font-weight: 500; }
    .dialog .app span { font-size: 22px; color: #5f6368; }
    .dialog .btns { display: flex; justify-content: flex-end; gap: 46px; margin-top: 44px; font-size: 26px; font-weight: 600; color: #1a73e8; }

    /* Màn hình chính. */
    .home { position: absolute; inset: 0; background: linear-gradient(180deg, #e8eef8 0%, #f4efe9 100%); }
    .grid { position: absolute; left: 50px; right: 50px; top: 170px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 56px; justify-items: center; }
    .icon { width: 112px; height: 112px; border-radius: 26px; background: rgba(255,255,255,.72); }
    .icon img { width: 100%; height: 100%; border-radius: 26px; }
    .dock { position: absolute; left: 30px; right: 30px; bottom: 30px; height: 160px; border-radius: 50px; background: rgba(255,255,255,.45); display: flex; justify-content: space-around; align-items: center; }
    .launch { position: absolute; inset: 0; background: #fff; display: grid; place-items: center; }
    .launch img { width: 170px; height: 170px; border-radius: 38px; }

    /* Chạm: vòng tròn xám mờ như video hỗ trợ của Apple. */
    .tap { position: absolute; z-index: 30; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; background: rgba(60,60,67,.22); border: 3px solid rgba(255,255,255,.9); box-shadow: 0 4px 18px rgba(0,0,0,.18); opacity: 0; }

    /* Cảnh mở đầu / kết thúc. */
    .hero { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 100px; }
    .hero img { width: 260px; height: 260px; border-radius: 58px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.35); }
    .hero h1 { margin-top: 70px; font-size: 84px; line-height: 1.06; font-weight: 700; letter-spacing: -.04em; text-wrap: balance; }
    .hero p { margin-top: 26px; font-size: 36px; color: #86868b; }
    .hero .url { margin-top: 40px; font-size: 30px; font-weight: 600; color: #0066cc; }

    /* Chấm tiến độ. */
    .dots { position: absolute; left: 0; right: 0; bottom: 70px; display: flex; justify-content: center; gap: 14px; }
    .dots i { width: 12px; height: 12px; border-radius: 6px; background: #d2d2d7; transition: none; }
    .dots i.on { width: 44px; background: #1d1d1f; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const ICON = "../../../public/favicon/web-app-manifest-512x512.png";
    const DOMAIN = "hugowishpax.studio";

    // Chữ trên cảnh + nhãn trong giao diện giả lập (chép theo nhãn thật của
    // Safari/Chrome ở ngôn ngữ đó). Lời đọc tương ứng: ../voice-script.md.
    const COPY = {
      vi: {
        intro: { title: "Hugo Studio trên màn hình chính", sub: "iPhone và Android · khoảng 30 giây" },
        scenes: [
          null,
          { eyebrow: "iPhone · Bước 1", title: "Mở trang bằng Safari" },
          { eyebrow: "iPhone · Bước 2", title: "Chạm nút Chia sẻ" },
          { eyebrow: "iPhone · Bước 3", title: "Thêm vào Màn hình chính" },
          { eyebrow: "iPhone · Bước 4", title: "Bật ứng dụng web, chạm Thêm" },
          { eyebrow: "Android · Chrome", title: "Cài đặt bằng Chrome" },
          { eyebrow: "Hoàn tất", title: "Mở từ màn hình chính" },
        ],
        outro: { title: "Sẵn sàng.", sub: "Hugo Studio chạy toàn màn hình, như một ứng dụng thật." },
        ui: { pageTitle: "Hugo Studio", pageText: "Học, làm và lớn lên cùng cộng đồng.", pageCta: "Bắt đầu", openSafari: "Mở trong Safari", copyLink: "Sao chép liên kết", share: "Chia sẻ", refresh: "Làm mới", copy: "Sao chép", readingList: "Thêm vào Danh sách đọc", bookmark: "Thêm dấu trang", favorites: "Thêm vào Mục ưa thích", addHome: "Thêm vào MH chính", addHomeFull: "Thêm vào Màn hình chính", cancel: "Hủy", add: "Thêm", webApp: "Mở dưới dạng ứng dụng web", webAppHint: "Bật để Hugo Studio mở toàn màn hình, không có thanh địa chỉ.", newTab: "Thẻ mới", history: "Lịch sử", downloads: "Tài nguyên đã tải xuống", installApp: "Cài đặt ứng dụng", installTitle: "Cài đặt ứng dụng?", install: "Cài đặt" },
      },
      en: {
        intro: { title: "Hugo Studio on your home screen", sub: "iPhone and Android · about 30 seconds" },
        scenes: [
          null,
          { eyebrow: "iPhone · Step 1", title: "Open the page in Safari" },
          { eyebrow: "iPhone · Step 2", title: "Tap Share" },
          { eyebrow: "iPhone · Step 3", title: "Add to Home Screen" },
          { eyebrow: "iPhone · Step 4", title: "Turn on Web App, tap Add" },
          { eyebrow: "Android · Chrome", title: "Install with Chrome" },
          { eyebrow: "Done", title: "Open it from your home screen" },
        ],
        outro: { title: "You're all set.", sub: "Hugo Studio runs full screen, just like a real app." },
        ui: { pageTitle: "Hugo Studio", pageText: "Learn, build and grow with the community.", pageCta: "Get started", openSafari: "Open in Safari", copyLink: "Copy link", share: "Share", refresh: "Refresh", copy: "Copy", readingList: "Add to Reading List", bookmark: "Add Bookmark", favorites: "Add to Favorites", addHome: "Add to Home Screen", addHomeFull: "Add to Home Screen", cancel: "Cancel", add: "Add", webApp: "Open as Web App", webAppHint: "Keep this on so Hugo Studio opens full screen, with no address bar.", newTab: "New tab", history: "History", downloads: "Downloads", installApp: "Install app", installTitle: "Install app?", install: "Install" },
      },
      zh: {
        intro: { title: "把 Hugo Studio 放到主屏幕", sub: "iPhone 与安卓 · 约 30 秒" },
        scenes: [
          null,
          { eyebrow: "iPhone · 第 1 步", title: "用 Safari 打开页面" },
          { eyebrow: "iPhone · 第 2 步", title: "点按“共享”" },
          { eyebrow: "iPhone · 第 3 步", title: "添加到主屏幕" },
          { eyebrow: "iPhone · 第 4 步", title: "打开网页 App，点按添加" },
          { eyebrow: "安卓 · Chrome", title: "用 Chrome 安装" },
          { eyebrow: "完成", title: "从主屏幕打开" },
        ],
        outro: { title: "一切就绪。", sub: "Hugo Studio 全屏运行，就像真正的 App。" },
        ui: { pageTitle: "Hugo Studio", pageText: "与社区一起学习、创作、成长。", pageCta: "开始", openSafari: "在 Safari 中打开", copyLink: "拷贝链接", share: "共享", refresh: "刷新", copy: "拷贝", readingList: "添加到阅读列表", bookmark: "添加书签", favorites: "添加到个人收藏", addHome: "添加到主屏幕", addHomeFull: "添加到主屏幕", cancel: "取消", add: "添加", webApp: "作为网页 App 打开", webAppHint: "保持打开，Hugo Studio 就会全屏显示，没有地址栏。", newTab: "新标签页", history: "历史记录", downloads: "下载内容", installApp: "安装应用", installTitle: "安装应用？", install: "安装" },
      },
    };

    const params = new URLSearchParams(location.search);
    const lang = COPY[params.get("lang")] ? params.get("lang") : "vi";
    const C = COPY[lang];
    const U = C.ui;
    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;

    // Độ dài mặc định ước theo lời đọc; render.mjs truyền độ dài thật.
    const DEFAULT_DURATIONS = [5.5, 9, 6, 5.5, 7.5, 9.5, 9];
    const durations = (params.get("durations") || "").split(",").map(Number).filter((n) => n > 0);
    const DUR = DEFAULT_DURATIONS.map((d, i) => durations[i] || d);
    const STARTS = DUR.map((_, i) => DUR.slice(0, i).reduce((a, b) => a + b, 0));
    const TOTAL = DUR.reduce((a, b) => a + b, 0);
    window.TOTAL = TOTAL;
    window.SCENE_STARTS = STARTS;

    // ── Tiện ích thời gian ──────────────────────────────────────────────
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const easeOut = (p) => 1 - Math.pow(1 - p, 3);
    const easeInOut = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    /** Tiến độ 0→1 (đã làm mượt) của khoảng [a, b] tại thời điểm t. */
    const seg = (t, a, b, ease = easeInOut) => ease(clamp((t - a) / (b - a)));
    const mix = (a, b, p) => a + (b - a) * p;

    // ── Biểu tượng (nét mảnh, kiểu SF Symbols) ──────────────────────────
    const SVG = {
      back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
      fwd: '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
      share: '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v8a2 2 0 002 2h8a2 2 0 002-2v-8"/></svg>',
      book: '<svg viewBox="0 0 24 24"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/></svg>',
      tabs: '<svg viewBox="0 0 24 24"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 4h10a2 2 0 012 2v10"/></svg>',
      copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>',
      glasses: '<svg viewBox="0 0 24 24"><circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 14h4M3 13l2-6M21 13l-2-6"/></svg>',
      star: '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
      plusbox: '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
      compass: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
      link: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
      refresh: '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
      plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      down: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
      install: '<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/></svg>',
      signal: '<svg viewBox="0 0 34 22"><rect x="0" y="14" width="6" height="8" rx="1.5"/><rect x="9" y="10" width="6" height="12" rx="1.5"/><rect x="18" y="5" width="6" height="17" rx="1.5"/><rect x="27" y="0" width="6" height="22" rx="1.5"/></svg>',
      battery: '<svg viewBox="0 0 50 22"><rect x="1" y="1" width="42" height="20" rx="6" fill="none" stroke="#1d1d1f" stroke-opacity=".4" stroke-width="2"/><rect x="4" y="4" width="34" height="14" rx="3.5"/><rect x="45" y="7" width="3" height="8" rx="1.5" opacity=".4"/></svg>',
    };

    const status = (android) => android
      ? `<div class="status"><span>9:41</span><span>${SVG.signal}&nbsp;${SVG.battery}</span></div>`
      : `<div class="status"><span>9:41</span><span>${SVG.signal}&nbsp;${SVG.battery}</span></div>`;
    const page = () => `<div class="page"><img src="${ICON}"><h2>${U.pageTitle}</h2><p>${U.pageText}</p>
      <div class="bar" style="width:86%"></div><div class="bar" style="width:72%"></div><div class="bar" style="width:80%"></div>
      <div class="cta">${U.pageCta}</div></div>`;
    const safariBar = () => `<div class="safari"><div class="addr"><small>AA</small>${DOMAIN}</div>
      <div class="tools"><span>${SVG.back}</span><span>${SVG.fwd}</span><span id="share-btn">${SVG.share}</span><span>${SVG.book}</span><span>${SVG.tabs}</span></div></div>`;
    const tap = (id) => `<div class="tap" id="${id}"></div>`;
    const apps = (withHugo) => Array.from({ length: 16 }, (_, i) =>
      (withHugo && i === 9) ? `<div class="icon" id="hugo-icon"><img src="${ICON}"></div>` : `<div class="icon"></div>`).join("");

    // ── Cảnh ────────────────────────────────────────────────────────────
    // Mỗi cảnh: html (dựng một lần) + update(t) với t = giây kể từ đầu cảnh.
    const $ = (sel, el) => el.querySelector(sel);
    const show = (el, o, y = 0, s = 1) => { el.style.opacity = o; el.style.transform = `translateY(${y}px) scale(${s})`; };
    /** Vòng chạm: hiện ở (x, y) lúc `at`, nhấn xuống, rồi tan. */
    const tapAt = (el, t, at, x, y) => {
      const p = t - at;
      el.style.left = `${x}px`; el.style.top = `${y}px`;
      if (p < -0.35 || p > 0.6) { el.style.opacity = 0; return; }
      const appear = seg(p, -0.35, 0, easeOut);
      const press = p < 0 ? 1 : p < 0.15 ? mix(1, .82, p / .15) : mix(.82, 1.15, seg(p, .15, .6));
      el.style.opacity = p < .15 ? appear : 1 - seg(p, .15, .6);
      el.style.transform = `scale(${press * mix(1.3, 1, appear)})`;
    };

    const SCENES = [
      // 0 · Mở đầu
      {
        phone: null,
        html: () => `<div class="hero"><img id="i0" src="${ICON}"><h1 id="h0">${C.intro.title}</h1><p id="p0">${C.intro.sub}</p></div>`,
        update(t, el) {
          show($("#i0", el), seg(t, .2, 1.1), 0, mix(.86, 1, seg(t, .2, 1.4, easeOut)));
          show($("#h0", el), seg(t, .7, 1.5), mix(24, 0, seg(t, .7, 1.6, easeOut)));
          show($("#p0", el), seg(t, 1.1, 1.9), mix(18, 0, seg(t, 1.1, 2, easeOut)));
        },
      },
      // 1 · iPhone: từ trình duyệt trong app → Safari
      {
        phone: "ios",
        html: () => `<div class="ui" id="inapp-ui">${page()}<div class="inapp"><span class="x">✕</span><span class="dom">${DOMAIN}</span><span class="more" id="more">•••</span></div>
            <div class="scrim" id="scrim1"></div>
            <div class="sheet" id="sheet1"><div class="grabber"></div>
              <div class="group"><div class="row hl" id="row-safari">${U.openSafari}${SVG.compass}</div><div class="row">${U.copyLink}${SVG.link}</div><div class="row">${U.share}${SVG.share}</div></div>
            </div></div>
          <div class="ui" id="safari-ui">${page()}${safariBar()}</div>${tap("tap1")}`,
        update(t, el) {
          if (t < 2.6) tapAt($("#tap1", el), t, 1.4, 548, 144);
          else tapAt($("#tap1", el), t, 3.3, 300, 1032);
          const open = seg(t, 1.6, 2.1);
          $("#scrim1", el).style.opacity = open * (1 - seg(t, 3.6, 3.9));
          $("#sheet1", el).style.transform = `translateY(${mix(420, 0, open)}px)`;
          const toSafari = seg(t, 3.6, 4.2);
          $("#inapp-ui", el).style.opacity = 1 - toSafari;
          $("#safari-ui", el).style.opacity = toSafari;
        },
      },
      // 2 · iPhone: chạm Chia sẻ
      {
        phone: "ios",
        html: () => `<div class="ui">${page()}${safariBar()}<div class="scrim" id="scrim2"></div>
            <div class="sheet" id="sheet2"><div class="grabber"></div>
              <div class="sheet-head"><img src="${ICON}"><div><b>Hugo Studio</b><span>${DOMAIN}</span></div></div>
              <div class="group"><div class="row">${U.copy}${SVG.copy}</div><div class="row">${U.readingList}${SVG.glasses}</div><div class="row">${U.bookmark}${SVG.book}</div></div>
            </div></div>${tap("tap2")}`,
        update(t, el) {
          tapAt($("#tap2", el), t, 1.5, 302, 1210);
          const open = seg(t, 1.8, 2.5);
          $("#scrim2", el).style.opacity = open;
          $("#sheet2", el).style.transform = `translateY(${mix(620, 0, open)}px)`;
        },
      },
      // 3 · iPhone: kéo lên, chọn Thêm vào Màn hình chính
      {
        phone: "ios",
        html: () => `<div class="ui">${page()}${safariBar()}<div class="scrim" style="opacity:1"></div>
            <div class="sheet" id="sheet3"><div class="grabber"></div>
              <div class="sheet-head"><img src="${ICON}"><div><b>Hugo Studio</b><span>${DOMAIN}</span></div></div>
              <div class="group"><div class="row">${U.copy}${SVG.copy}</div><div class="row">${U.readingList}${SVG.glasses}</div><div class="row">${U.bookmark}${SVG.book}</div></div>
              <div class="group"><div class="row">${U.favorites}${SVG.star}</div><div class="row" id="row-home">${U.addHomeFull}${SVG.plusbox}</div></div>
            </div></div>${tap("tap3")}`,
        update(t, el) {
          const lift = seg(t, .6, 1.6);
          $("#sheet3", el).style.transform = `translateY(${mix(210, 0, lift)}px)`;
          $("#row-home", el).classList.toggle("hl", t > 2.35);
          tapAt($("#tap3", el), t, 2.3, 300, 1118);
        },
      },
      // 4 · iPhone: bật "Mở dưới dạng ứng dụng web" → Thêm → xuất hiện trên màn hình chính
      {
        phone: "ios",
        html: () => `<div class="ui" id="form-ui" style="background:#f2f2f7">
            <div class="nav"><span class="l">${U.cancel}</span><b>${U.addHome}</b><span class="r">${U.add}</span></div>
            <div class="form"><div class="card"><img src="${ICON}"><div style="flex:1"><div class="name">Hugo Studio</div><div class="url">https://${DOMAIN}</div></div></div>
              <div class="switchrow">${U.webApp}<div class="switch" id="sw"><i></i></div></div>
              <p class="hint">${U.webAppHint}</p></div></div>
          <div class="ui home" id="home4"><div class="grid">${apps(true)}</div><div class="dock"><div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div></div></div>${tap("tap4")}`,
        update(t, el) {
          tapAt($("#tap4", el), t, 1.6, 498, 427);
          const on = seg(t, 1.65, 1.95);
          $("#sw", el).style.background = `rgb(${mix(233, 52, on)}, ${mix(233, 199, on)}, ${mix(235, 89, on)})`;
          $("#sw i", el).style.transform = `translateX(${36 * on}px)`;
          if (t > 2.4) tapAt($("#tap4", el), t, 3.1, 546, 148);
          const home = seg(t, 3.4, 4.0);
          $("#form-ui", el).style.opacity = 1 - home;
          $("#home4", el).style.opacity = home;
          const pop = seg(t, 3.8, 4.5, easeOut);
          const icon = $("#hugo-icon", el);
          icon.style.opacity = pop;
          icon.style.transform = `scale(${mix(.4, 1, pop)})`;
        },
      },
      // 5 · Android: Chrome ⋮ → Cài đặt ứng dụng → Cài đặt
      {
        phone: "android",
        html: () => `<div class="ui">${page().replace('class="page"', 'class="page" style="top:188px"')}
            <div class="chrome"><div class="omni">${DOMAIN}</div><div class="kebab">⋮</div></div>
            <div class="menu" id="menu5" style="top:150px"><div class="item">${SVG.plus}${U.newTab}</div><div class="item">${SVG.clock}${U.history}</div><div class="item">${SVG.down}${U.downloads}</div><div class="item" id="item-install">${SVG.install}${U.installApp}</div></div>
            <div class="scrim" id="scrim5"></div>
            <div class="dialog" id="dialog5"><h3>${U.installTitle}</h3><div class="app"><img src="${ICON}"><div><b>Hugo Studio</b><span>${DOMAIN}</span></div></div><div class="btns"><span>${U.cancel}</span><span>${U.install}</span></div></div>
          </div>${tap("tap5")}`,
        update(t, el) {
          tapAt($("#tap5", el), t, 1.4, 574, 136);
          const menu = seg(t, 1.6, 2.0, easeOut);
          const close = seg(t, 3.2, 3.4);
          $("#menu5", el).style.opacity = menu * (1 - close);
          $("#menu5", el).style.transform = `scale(${mix(.9, 1, menu)})`;
          $("#item-install", el).classList.toggle("hl", t > 2.95);
          if (t > 2.2) tapAt($("#tap5", el), t, 2.9, 330, 459);
          const dlg = seg(t, 3.4, 3.8, easeOut) * (1 - seg(t, 5.3, 5.6));
          $("#scrim5", el).style.opacity = dlg;
          $("#dialog5", el).style.opacity = dlg;
          $("#dialog5", el).style.transform = `scale(${mix(.94, 1, dlg)})`;
          if (t > 3.6) tapAt($("#tap5", el), t, 5.0, 498, 704);
        },
      },
      // 6 · Mở từ màn hình chính, rồi khung kết
      {
        phone: "ios",
        html: () => `<div class="ui home"><div class="grid">${apps(true)}</div><div class="dock"><div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div></div></div>
          <div class="ui launch" id="launch"><img src="${ICON}"></div>${tap("tap6")}`,
        outro: true,
        update(t, el) {
          tapAt($("#tap6", el), t, 1.5, 365, 461);
          const open = seg(t, 1.7, 2.4, easeOut);
          const launch = $("#launch", el);
          launch.style.opacity = open;
          launch.style.clipPath = `inset(${mix(380, 0, open)}px ${mix(250, 0, open)}px ${mix(820, 0, open)}px ${mix(250, 0, open)}px round ${mix(26, 88, open)}px)`;
        },
      },
    ];

    // ── Dựng ────────────────────────────────────────────────────────────
    const root = document.getElementById("root");
    const device = (kind) => `<div class="device"><div class="frame ${kind === "android" ? "android" : ""}"><div class="screen">
      ${kind === "android" ? '<div class="punch"></div>' : '<div class="island"></div>'}${status(kind === "android")}<div class="content"></div></div></div></div>`;
    const els = SCENES.map((scene, i) => {
      const layer = document.createElement("div");
      layer.className = "layer";
      const copy = C.scenes[i];
      layer.innerHTML = (copy ? `<div class="copy"><div class="eyebrow">${copy.eyebrow}</div><div class="title">${copy.title}</div></div>` : "")
        + (scene.phone ? device(scene.phone) : scene.html());
      if (scene.phone) layer.querySelector(".content").outerHTML = scene.html();
      if (scene.outro) layer.insertAdjacentHTML("beforeend", `<div class="hero" id="outro" style="opacity:0;background:#fff;z-index:50"><img src="${ICON}"><h1>${C.outro.title}</h1><p>${C.outro.sub}</p><div class="url">${DOMAIN}</div></div>`);
      root.appendChild(layer);
      return layer;
    });
    const dots = document.createElement("div");
    dots.className = "dots";
    dots.innerHTML = SCENES.map(() => "<i></i>").join("");
    root.appendChild(dots);

    // Hai cảnh liền nhau cùng một chiếc điện thoại thì điện thoại đứng yên,
    // chỉ chữ và màn hình đổi; đổi loại máy thì cả cảnh tan sang cảnh sau.
    const FADE = 0.45;
    window.seek = (time) => {
      SCENES.forEach((scene, i) => {
        const t = time - STARTS[i];
        const el = els[i];
        const inP = i === 0 ? 1 : seg(t, 0, FADE);
        const outP = i === SCENES.length - 1 ? 0 : seg(t, DUR[i] - FADE * 0.2, DUR[i] + FADE * 0.8);
        const visible = t > -0.01 && t < DUR[i] + FADE;
        el.style.display = visible ? "block" : "none";
        if (!visible) return;
        const samePrev = i > 0 && Boolean(scene.phone) && SCENES[i - 1].phone === scene.phone;
        const sameNext = Boolean(scene.phone) && SCENES[i + 1]?.phone === scene.phone;
        // Cùng một chiếc máy: lớp cũ đứng yên bên dưới, màn hình mới hiện dần
        // lên trong khung — khung máy không nhấp nháy giữa hai cảnh.
        el.style.opacity = (samePrev ? 1 : inP) * (sameNext ? 1 : 1 - outP);
        el.style.zIndex = String(i);
        const copy = el.querySelector(".copy");
        if (copy) show(copy, inP * (1 - outP), mix(16, 0, inP));
        const screen = el.querySelector(".device .screen");
        if (screen) screen.style.opacity = samePrev ? inP : 1;
        scene.update(Math.max(0, t), el);
        if (scene.outro) {
          const end = seg(t, DUR[i] - 2.6, DUR[i] - 1.9);
          show(el.querySelector("#outro"), end, 0, 1);
        }
      });
      const current = STARTS.findLastIndex((s) => time >= s);
      dots.querySelectorAll("i").forEach((d, i) => d.classList.toggle("on", i === current));
      dots.style.opacity = time > TOTAL - 2.6 ? 1 - seg(time, TOTAL - 2.6, TOTAL - 2.2) : 1;
    };

    window.ready = Promise.all([...document.images].map((img) => img.decode().catch(() => {})));
    if (!params.has("render")) {
      const t0 = performance.now();
      const loop = () => { window.seek(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); };
      window.ready.then(loop);
    } else {
      window.seek(0);
    }
  </script>
</body>
</html>
